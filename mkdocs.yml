site_name: MIP Modelling · Fabio Furini
site_description: >-
  Mixed-integer linear models for Management Engineering:
  build them, prove them, squeeze them with bounds and solve them with Gurobi.
site_author: Fabio Furini
repo_url: https://github.com/fabiofurini/mip-modelling
copyright: >-
  &copy; 2026 Fabio Furini — text, figures and data licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>,
  Python code licensed under
  <a href="https://github.com/fabiofurini/mip-modelling/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: en
  icon:
    logo: material/vector-polygon
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest

plugins:
  - search

extra:
  social:
    - icon: material/web
      link: https://sites.google.com/view/fabiofurini/home-page
      name: Fabio Furini — personal website
    - icon: material/school
      link: https://www.diag.uniroma1.it/
      name: DIAG — Sapienza University of Rome
    - icon: fontawesome/brands/github
      link: https://github.com/fabiofurini
      name: GitHub
    - icon: material/chart-timeline-variant
      link: https://fabiofurini.github.io/operations-research-lab/
      name: Operations Research Lab
  alternate:
    - name: Italiano
      link: https://fabiofurini.github.io/modellazione-mip/
      lang: it
    - name: English
      link: https://fabiofurini.github.io/mip-modelling/
      lang: en

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Modelling:
      - modelling.md
      - 1. What is a MIP model: modelling-1.md
      - 2. Logic and binary variables: modelling-2.md
      - 3. Links between variables:
          - links.md
          - 3.1 Activation: links-01.md
          - 3.2 Fixed cost: links-02.md
          - 3.3 Minimum lot: links-03.md
          - 3.4 Integer counts: links-04.md
          - 3.5 Maximum variable: links-05.md
          - 3.6 Min-max and max-min: links-06.md
          - 3.7 Absolute value: links-07.md
          - 3.8 Big-M: links-08.md
          - 3.9 Precedences: links-09.md
          - 3.10 If and only if: links-10.md
          - 3.11 Counting types: links-11.md
          - 3.12 Alldiff and expansion: links-12.md
          - 3.13 Soft constraints: links-13.md
          - 3.14 Piecewise functions: links-14.md
      - 4. Relaxations, duality and bounds: modelling-4.md
      - 5. Constructive heuristics: modelling-5.md
      - 6. From the model to Python/Gurobi: modelling-6.md
  - The problems:
