site_name: MIP Modelling · Fabio Furini
site_description: >-
  Mixed-integer linear models for Management Engineering:
  build them, prove them, squeeze them with bounds and solve them with Gurobi.
site_author: Fabio Furini
repo_url: https://github.com/fabiofurini/mip-modelling
copyright: >-
  &copy; 2026 Fabio Furini — text, figures and data licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>,
  Python code licensed under
  <a href="https://github.com/fabiofurini/mip-modelling/blob/main/LICENSE-CODE">MIT</a>

theme:
  name: material
  language: en
  icon:
    logo: material/vector-polygon
  font:
    text: Source Sans 3
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest

plugins:
  - search

extra:
  social:
    - icon: material/web
      link: https://sites.google.com/view/fabiofurini/home-page
      name: Fabio Furini — personal website
    - icon: material/school
      link: https://www.diag.uniroma1.it/
      name: DIAG — Sapienza University of Rome
    - icon: fontawesome/brands/github
      link: https://github.com/fabiofurini
      name: GitHub
    - icon: material/chart-timeline-variant
      link: https://fabiofurini.github.io/operations-research-lab/
      name: Operations Research Lab — the first course of the series
  alternate:
    - name: Italiano
      link: https://fabiofurini.github.io/modellazione-mip/
      lang: it
    - name: English
      link: https://fabiofurini.github.io/mip-modelling/
      lang: en

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Modelling:
      - modelling.md
  - The problems:
      - problems.md
      - Assignment and scheduling:
          - scheduling.md
          - 7.1 Minimum-cost assignment: scheduling-1.md
          - 7.2 Machines with fixed cost: scheduling-2.md
          - 7.3 Job selection: scheduling-3.md
          - 7.4 Parallel jobs: scheduling-4.md
          - 7.5 Classes with setup: scheduling-5.md
          - 7.6 Classes with bonus: scheduling-6.md
          - 7.7 Total tardiness: scheduling-7.md
  - The course:
      - organization.md
      - Notebooks in Colab: notebooks.md
